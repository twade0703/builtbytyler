<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Applicants &middot; Built by Tyler</title>
  <!-- Tyler's private applicant board. Opened from a link he was texted; the
       data needs the key after the # in that link (functions/api/hiring-board.js). -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0B0C10">
  <meta name="apple-mobile-web-app-title" content="Applicants">
  <style>
    :root{--bg:#0B0C10;--card:#14161C;--card2:#1A1D25;--line:rgba(255,255,255,.08);--tx:#ECEEF3;--mu:#99A1B3;--dim:#646C7E;
      --blue:#60A5FA;--violet:#A78BFA;--green:#4ADE80;--amber:#FBBF24;--red:#F87171;--slate:#64748B}
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Instrument Sans",system-ui,-apple-system,sans-serif;
      padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
    button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
    a{color:var(--blue)}
    .wrap{max-width:720px;margin:0 auto;padding:18px 16px 0}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
    .brand{display:flex;flex-direction:column;gap:2px}
    .brand b{font:600 22px/1.1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em}
    .brand span{font:12px "JetBrains Mono",ui-monospace,monospace;color:var(--mu)}
    .brand span.stale{color:var(--amber)}
    .refresh{display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:500}
    .refresh svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .refresh.spin svg{animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    .hero{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:8px;margin-bottom:14px}
    .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 13px}
    .stat b{display:block;font:500 30px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:-.04em}
    .stat u{display:block;text-decoration:none;font-size:12px;color:var(--mu);margin-top:7px}
    .stat.big b{font-size:40px}

    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:14px;position:sticky;top:max(8px,env(safe-area-inset-top));z-index:5}
    .tab{--c:var(--blue);display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:12px;text-align:left;transition:background .15s}
    .tab b{font-size:15px;font-weight:600}
    .tab u{text-decoration:none;font-size:12px;color:var(--mu)}
    .tab em{font:normal 500 20px/1 "JetBrains Mono",ui-monospace,monospace;color:var(--mu)}
    .tab .row{display:flex;justify-content:space-between;align-items:baseline;width:100%}
    .tab.on{background:color-mix(in srgb,var(--c) 18%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 45%,transparent)}
    .tab.on em,.tab.on b{color:var(--c)}

    .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
    .chip{display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px}
    .chip i{width:8px;height:8px;border-radius:50%;background:var(--t,var(--mu))}
    .chip b{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:500}

    .plan{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 13px;margin-bottom:14px}
    .prule{margin:0 0 9px;font-size:13.5px;font-weight:500}
    .pmos{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -13px;padding:0 13px}
    .pmos::-webkit-scrollbar{display:none}
    .pmo{flex:none;display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.02);min-width:78px}
    .pmo u{text-decoration:none;font:10.5px "JetBrains Mono",ui-monospace,monospace;color:var(--mu)}
    .pmo b{font:500 16px/1.1 "JetBrains Mono",ui-monospace,monospace;color:var(--blue)}
    .pmo em{font-style:normal;font-size:11px;color:var(--dim)}
    .pmo:first-child{border-color:rgba(96,165,250,.45)}
    .pnote{margin:9px 0 0;font-size:12.5px;color:var(--mu)}
    .chart{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 12px 6px;margin-bottom:14px}
    .chart h3{margin:0 0 6px;font-size:13px;font-weight:600}
    .chart h3 span{font-weight:400;color:var(--mu)}
    .chart svg{display:block;max-width:100%;height:auto}
    .ax{fill:var(--dim);font:10px "JetBrains Mono",ui-monospace,monospace}

    .list{display:flex;flex-direction:column;gap:8px}
    .app{--t:var(--blue);background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
    .app.on{border-color:color-mix(in srgb,var(--t) 45%,transparent)}
    .app>button{width:100%;display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:4px 11px;align-items:start;padding:13px 14px;text-align:left}
    .dot{width:10px;height:10px;border-radius:50%;background:var(--t);margin-top:5px;box-shadow:0 0 10px color-mix(in srgb,var(--t) 70%,transparent)}
    .who b{display:block;font-size:15.5px;font-weight:600;text-transform:capitalize}
    .who span{display:block;font-size:12.5px;color:var(--mu)}
    .who p{margin:5px 0 0;font-size:13px;color:var(--tx);opacity:.85}
    .side{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
    .tier{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:8px;color:var(--t);background:color-mix(in srgb,var(--t) 14%,transparent)}
    .ago{font:11px "JetBrains Mono",ui-monospace,monospace;color:var(--dim)}
    .badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
    .bdg{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--mu)}
    .bdg.p{color:#DDD6FE;border-color:rgba(167,139,250,.45);background:rgba(167,139,250,.12)}
    .bdg.x{color:#FCA5A5;border-color:rgba(248,113,113,.4)}
    .more{padding:0 14px 14px 35px;display:flex;flex-direction:column;gap:11px;font-size:14px}
    .more ul{margin:0;padding-left:18px}
    .lbl{font:10px "JetBrains Mono",ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin-bottom:4px}
    .note{padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--t) 10%,transparent);border:1px solid color-mix(in srgb,var(--t) 25%,transparent)}
    .ans div{padding:6px 0;border-top:1px solid var(--line)}
    .ans b{display:block;font-size:12px;font-weight:500;color:var(--mu)}
    details.res summary{list-style:none;cursor:pointer;color:var(--blue);font-weight:500}
    .rs{margin-top:10px;padding:16px 16px 12px;border-radius:14px;background:var(--card2);border:1px solid var(--line);line-height:1.5}
    .rs header{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:4px}
    .rs header b{display:block;font-size:18px;font-weight:600}
    .rs header span{display:block;font-size:13px;color:var(--mu);margin-top:2px}
    .rs header em{display:block;font-style:normal;font:500 11px "JetBrains Mono",ui-monospace,monospace;color:var(--dim);margin-top:3px}
    .rs h4{margin:16px 0 6px;font:600 11px "JetBrains Mono",ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);padding-bottom:4px;border-bottom:1px solid rgba(96,165,250,.25)}
    .rs-job{margin:10px 0 2px}
    .rs-jt{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
    .rs-jt b{font-size:14px;font-weight:600}
    .rs-jt em{font-style:normal;font:500 11px "JetBrains Mono",ui-monospace,monospace;color:var(--mu)}
    .rs-jo{font-size:12.5px;color:var(--mu)}
    .rs ul{margin:5px 0 4px;padding-left:18px}
    .rs li{font-size:13px;margin:3px 0}
    .rs li::marker{color:var(--blue)}
    .rs p{font-size:13px;margin:5px 0}
    .rs-chips{display:flex;flex-wrap:wrap;gap:6px;margin:5px 0}
    .rs-chips span{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
    .rs-hr{display:flex;align-items:center;gap:8px;margin:18px 0 2px;color:var(--dim);font:500 10px "JetBrains Mono",ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase}
    .rs-hr::before,.rs-hr::after{content:"";flex:1;height:1px;background:var(--line)}
    details.res summary::-webkit-details-marker{display:none}
    .res pre{margin:8px 0 0;padding:12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);white-space:pre-wrap;word-break:break-word;
      font:12.5px/1.55 "Instrument Sans",system-ui,sans-serif;max-height:60vh;overflow:auto}
    .indeed{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;padding:9px 13px;border-radius:999px;border:1px solid rgba(96,165,250,.4);background:rgba(96,165,250,.1);color:#BFDBFE;text-decoration:none;font-size:13px;font-weight:500}
    .empty,.gate{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 18px;color:var(--mu);text-align:center}
    .gate b{display:block;color:var(--tx);font-size:17px;margin-bottom:6px}
    .rej{margin:14px 2px 2px;font-size:13px;font-weight:600;color:var(--mu)}
    .rej span{font-weight:400;color:var(--dim)}
    .foot{margin:20px 0 0;font-size:12px;color:var(--dim);text-align:center}
    /* Messages tab (2026-10-29): the same inbox as RAGER's CRM > Messages */
    .tab{min-width:0} .tab.msgs{grid-column:1 / -1}
    button.chip{cursor:pointer} .chip.on{background:color-mix(in srgb,var(--blue) 18%,transparent);border-color:rgba(96,165,250,.5)}
    .app.mturn{border-color:rgba(251,191,36,.45)}
    .mprev{color:var(--mu)!important;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .msum{font-size:13px;color:var(--mu)} .mcall{font-weight:600;color:var(--blue)}
    .mthread{display:flex;flex-direction:column;gap:9px;max-height:55vh;overflow:auto;padding:10px;border-radius:12px;background:var(--card2);border:1px solid var(--line)}
    .mb{max-width:85%;display:flex;flex-direction:column;gap:3px} .mb.them{align-self:flex-start} .mb.me{align-self:flex-end;align-items:flex-end}
    .mbt{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.45;padding:9px 11px;border-radius:12px}
    .mb.them .mbt{background:rgba(255,255,255,.08);border:1px solid var(--line);border-bottom-left-radius:4px}
    .mb.me .mbt{background:rgba(96,165,250,.16);border:1px solid rgba(96,165,250,.38);border-bottom-right-radius:4px}
    .mb.pend .mbt{border-style:dashed} .mbm{font-size:11px;color:var(--dim)}
    .mauto{align-self:center;font-size:11px;color:var(--dim);padding:3px 10px;border-radius:999px;border:1px dashed var(--line)}
    .mtps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px 0 -35px;padding:0 14px 2px 35px} .mtps::-webkit-scrollbar{display:none}
    .mtp{flex:none;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card2);font-size:13px;color:var(--mu)}
    .mtp.on{background:var(--blue);border-color:var(--blue);color:#05070B;font-weight:600}
    .mta{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--tx);font:16px/1.45 "Instrument Sans",system-ui,sans-serif;resize:vertical}
    .mgo{display:block;text-align:center;padding:13px 14px;border-radius:12px;background:var(--blue);color:#05070B;text-decoration:none;font-weight:600;font-size:15px}
    .mhint{font-size:12.5px;color:var(--dim);margin-top:-4px} .mhint.ok{color:var(--green)}
    .mguide{margin:8px 0;padding-left:18px;font-size:13px} .mguide li{margin:5px 0} .mavoid{font-size:12px;color:var(--amber);margin:0}
    /* Where each person stands (2026-10-30): icon + words, colour only as a second cue */
    .who .stl{--s:var(--mu);display:flex;width:fit-content;max-width:100%;align-items:center;gap:6px;margin-top:6px;padding:3px 10px 3px 8px;border-radius:999px;font-size:12px;font-weight:600;
      color:var(--s);background:color-mix(in srgb,var(--s) 13%,transparent);border:1px solid color-mix(in srgb,var(--s) 40%,transparent)}
    .who .stl i{font-style:normal;font-size:11px;line-height:1}
    .who .stl.s-none{font-weight:500;background:transparent;border-style:dashed}
    .who .stl.s-them{color:var(--tx);opacity:.85}
    .chips.sts{margin-top:-4px}
    .chips.sts .chip{font-size:12.5px;padding:6px 10px}
    .chips.sts .chip i{width:auto;height:auto;background:none;border-radius:0;font-style:normal;font-size:11px}
    .chip.s-you{color:var(--amber);border-color:rgba(251,191,36,.45)} .chip.s-booked,.chip.s-talked{color:var(--blue);border-color:rgba(96,165,250,.45)}
    .chip.s-picked{color:var(--green);border-color:rgba(74,222,128,.45)} .chip.s-none{color:var(--dim);border-style:dashed}
    @media (max-width:380px){ .hero{grid-template-columns:1fr 1fr} .stat.big{grid-column:1 / -1} }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand"><b>Applicants</b><span id="upd">Loading…</span></div>
      <button class="refresh" id="refresh" type="button" aria-label="Refresh"><svg viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3"/></svg>Refresh</button>
    </header>
    <main id="app"></main>
    <p class="foot">Private to Tyler. Don't forward this link: anyone with it can see this page.</p>
  </div>
  <script src="assets/js/hiring-board.js?v=111"></script>
</body>
</html>
