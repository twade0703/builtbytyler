<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Receptionist test &middot; Built by Tyler</title>
  <!-- Tyler's private report on the AI Receptionist test of 2026-11-15: his own call, the 104 test calls before and
       after the fix, the ending rules and what changed. Same private key as /run and /hiring (after the # in his
       link); data from /api/hiring-board?doc=desk, published by 06 Ventures/front-desk/audit/publish_desk.py.
       Colours: orange = before, aqua = after, and every mark is also labelled, because Tyler is colourblind. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <meta name="theme-color" content="#070A14">
  <style>
    :root{--bg:#070A14;--panel:#0D1120;--edge:rgba(160,180,255,.09);--edge2:rgba(160,180,255,.16);
      --tx:#EEF1FA;--mu:#97A0BD;--dim:#5E6888;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--other:#5e6888;
      --mono:"JetBrains Mono",ui-monospace,monospace}
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;min-height:100vh;color:var(--tx);font:14px/1.5 "Instrument Sans",system-ui,-apple-system,sans-serif;
      background:radial-gradient(1200px 600px at 10% -10%,rgba(57,135,229,.16),transparent 60%),
                 radial-gradient(900px 500px at 100% 20%,rgba(25,158,112,.08),transparent 60%),var(--bg);
      background-attachment:fixed;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
    button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
    .wrap{max-width:1360px;margin:0 auto;padding:16px}
    .top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
    .ttl b{display:block;font:700 20px/1.1 var(--mono);letter-spacing:.06em}
    .ttl span{display:block;margin-top:5px;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
    .btn{border:1px solid var(--edge2);border-radius:9px;padding:8px 12px;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
    .btn:hover{color:var(--tx);border-color:var(--s1)}
    .kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:12px}
    .kpi{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:14px 16px;min-width:0}
    .kpi .l{font:500 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
    .kpi .v{font:700 26px/1.15 var(--mono);margin-top:6px;white-space:nowrap}
    .kpi .v small{font:500 13px var(--mono);color:var(--dim)}
    .kpi .s{font-size:12px;color:var(--mu);margin-top:4px}
    .was{color:var(--s2)} .now{color:var(--s3)}
    .grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
    .panel{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.035),rgba(255,255,255,.008) 55%),var(--panel);
      border:1px solid var(--edge);border-radius:14px;padding:16px 18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 24px 48px -32px rgba(0,0,0,.9);min-width:0}
    .c12{grid-column:span 12}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}
    .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;flex-wrap:wrap}
    .ph h2{margin:0;font:700 12.5px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase}
    .ph p{margin:3px 0 0;font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
    .key{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mu)}
    .key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
    .issue{border:1px solid var(--edge);border-radius:12px;padding:12px 14px;margin-bottom:10px}
    .issue h3{margin:0 0 8px;font:700 14px/1.3 "Instrument Sans",sans-serif}
    .issue h3 em{font:600 10.5px var(--mono);font-style:normal;color:var(--dim);margin-right:8px}
    .q{display:grid;grid-template-columns:88px 1fr;gap:4px 10px;font-size:13px}
    .q dt{font:600 10px/1.9 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
    .q dd{margin:0;color:var(--mu)} .q dd.say{color:var(--tx)} .q dd.fix{color:var(--tx)}
    .bar{display:grid;grid-template-columns:1fr;gap:3px;margin-bottom:13px}
    .bar .lab{font-size:13px}
    .bar .row{display:grid;grid-template-columns:54px 1fr 66px;white-space:nowrap;align-items:center;gap:8px;font:500 11px var(--mono);color:var(--mu)}
    .bar .trk{height:10px;border-radius:5px;background:rgba(160,180,255,.07);overflow:hidden}
    .bar .trk b{display:block;height:100%;border-radius:5px;min-width:2px}
    .bar .n{text-align:right;color:var(--tx);font-weight:600}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--edge)}
    th{font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
    td.n,th.n{text-align:right;font-family:var(--mono)}
    .note{font-size:12.5px;color:var(--mu);margin:10px 0 0}
    .cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .cols.four{grid-template-columns:repeat(4,minmax(0,1fr))}
    .col h3{margin:0 0 6px;font:700 11px var(--mono);letter-spacing:.07em;text-transform:uppercase}
    ul{margin:0;padding-left:17px;color:var(--mu);font-size:13px} li{margin:0 0 6px} li::marker{color:var(--dim)}
    .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
    .chip{border:1px solid var(--edge2);border-radius:999px;padding:5px 11px;font:500 11.5px var(--mono);color:var(--mu)}
    .chip.on{background:var(--s1);border-color:var(--s1);color:#fff}
    .find{width:100%;max-width:340px;background:rgba(255,255,255,.03);border:1px solid var(--edge2);border-radius:9px;color:var(--tx);padding:8px 11px;font:inherit;margin-bottom:10px}
    .call{border-top:1px solid var(--edge)}
    .call>button{display:grid;grid-template-columns:38px 1fr auto auto;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 4px}
    .call>button:hover{background:rgba(255,255,255,.025)}
    .call .no{font:500 11px var(--mono);color:var(--dim)}
    .call .nm b{display:block;font-weight:600} .call .nm span{font-size:12px;color:var(--dim)}
    .pill{display:inline-block;border-radius:999px;padding:3px 9px;font:600 10.5px var(--mono);white-space:nowrap;border:1px solid}
    .pill.bad{color:#f0a487;border-color:rgba(217,89,38,.6);background:rgba(217,89,38,.12)}
    .pill.ok{color:#7fd6b5;border-color:rgba(25,158,112,.6);background:rgba(25,158,112,.12)}
    .pill.flag{color:#f0a487;border-color:rgba(217,89,38,.4);margin:0 4px 4px 0}
    .tx2{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 4px 16px}
    .tx h4{margin:0 0 8px;font:700 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--mu)}
    .ln{margin:0 0 6px;padding:7px 10px;border-radius:9px;font-size:13px;max-width:92%}
    .ln.c{background:rgba(57,135,229,.14);border:1px solid rgba(57,135,229,.3);margin-left:auto}
    .ln.d{background:rgba(255,255,255,.04);border:1px solid var(--edge)}
    .ln small{display:block;font:600 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
    .ln.gone{opacity:.55;border-style:dashed}
    .endtag{font:600 10.5px var(--mono);color:#f0a487;margin:2px 0 8px}
    .seg{display:inline-flex;border:1px solid var(--edge2);border-radius:9px;overflow:hidden}
    .seg button{padding:6px 11px;font:600 11px var(--mono);color:var(--mu)} .seg button.on{background:var(--s1);color:#fff}
    .msg{padding:60px 16px;text-align:center;color:var(--mu)}
    @media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:last-child{grid-column:span 2}.c7,.c6,.c5,.c4{grid-column:span 12}.cols,.cols.four{grid-template-columns:1fr 1fr}}
    @media (max-width:700px){.cols,.cols.four,.tx2{grid-template-columns:1fr}.call>button{grid-template-columns:30px 1fr auto}.call .aft{display:none}.kpi .v{font-size:22px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="ttl"><b>RECEPTIONIST TEST '26</b><span>104 test calls, before and after the Nov 15 fix · <span id="upd">loading…</span></span></div>
      <button class="btn" id="refresh" type="button">Refresh</button>
    </div>
    <div class="kpis" id="kpis"></div>
    <main id="app"><div class="msg">Loading…</div></main>
  </div>
  <script src="assets/js/desk-audit.js?v=1"></script>
</body>
</html>
