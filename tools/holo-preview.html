<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>holo preview</title>
<style>body{margin:0;background:#04070C;color:#8fb;font:12px monospace}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px}
.c{position:relative;aspect-ratio:4/3;background:radial-gradient(115% 95% at 50% 58%,#06223a 0%,#04111f 52%,#010305 100%);border:1px solid #234}
canvas{position:absolute;inset:0;width:100%;height:100%}
.l{position:absolute;left:6px;top:4px;z-index:2}</style></head><body>
<div class="g" id="g"></div>
<script src="../assets/js/hologram.js"></script>
<script>
const types=["arm","drone","evtol","rccar","transmitter","turret","rocket"];
const g=document.getElementById("g");
g.innerHTML=types.map(t=>`<div class="c plate__media"><span class="l">${t}</span><canvas data-holo="${t}"></canvas></div>`).join("");
window.BBTHolograms.mount();
document.querySelectorAll(".plate__media").forEach(el=>el.dispatchEvent(new Event("pointerenter")));
</script></body></html>
