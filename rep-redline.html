<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Rep agreement redline &middot; Built by Tyler</title>
  <!-- Tyler's private read of the attorney's 2026-11-20 redline of the Rep Agreement: what changed, what matters, what to
       send back. Data from /api/hiring-board?doc=redline (same private key as /democount), published by
       Website Builder MASTER/04 Legal/reps/attorney-redline-2026-11-20/publish_redline.py.
       Tyler is colourblind: every tag is an icon and a word, every bar carries its number. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#070A14">
  <meta name="apple-mobile-web-app-title" content="Redline">
  <style>
    :root{--bg:#070A14;--panel:#0D1120;--edge:rgba(160,180,255,.09);--edge2:rgba(160,180,255,.16);
      --tx:#EEF1FA;--mu:#97A0BD;--dim:#5E6888;--grid:rgba(160,180,255,.07);
      --s1:#3987e5;--s2:#d95926;--s3:#199e70;--other:#5e6888;
      --mono:"JetBrains Mono",ui-monospace,monospace}
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;min-height:100vh;color:var(--tx);font:14px/1.5 "Instrument Sans",system-ui,-apple-system,sans-serif;
      background:radial-gradient(1200px 600px at 10% -10%,rgba(57,135,229,.16),transparent 60%),
                 radial-gradient(900px 500px at 100% 20%,rgba(144,133,233,.10),transparent 60%),var(--bg);
      background-attachment:fixed;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
    button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
    .wrap{max-width:1180px;margin:0 auto;padding:16px}
    .panel{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.035),rgba(255,255,255,.008) 55%),var(--panel);
      border:1px solid var(--edge);border-radius:14px;padding:16px 18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 24px 48px -32px rgba(0,0,0,.9);min-width:0}
    .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;flex-wrap:wrap}
    .ph h2{margin:0;font:700 12.5px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase}
    .ph p{margin:3px 0 0;font:500 10.5px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
    .hdr{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px}
    .ttl b{display:block;font:700 26px/1.05 "Instrument Sans",sans-serif;letter-spacing:-.01em}
    .ttl span{display:block;margin-top:6px;font:500 10.5px/1.5 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
    .kpis{display:flex;flex-wrap:wrap;gap:22px 26px;align-items:flex-end}
    .kpi u{display:block;text-decoration:none;font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
    .kpi b{display:inline-block;margin-top:4px;font:600 24px/1 var(--mono);letter-spacing:-.02em}
    .kpi small{font:500 12px var(--mono);color:var(--mu);margin-left:6px}
    .refresh{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:9px;border:1px solid var(--edge2);font:500 12px var(--mono);color:var(--mu)}
    .refresh svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .refresh.spin svg{animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;margin-top:14px}
    .c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}.c12{grid-column:span 12}
    @media (max-width:1000px){.c8,.c7,.c6,.c5,.c4{grid-column:span 12}}
    .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:6px;font:600 10.5px var(--mono);letter-spacing:.06em;border:1px solid;white-space:nowrap}
    .pill.new{color:#8fbaf0;border-color:rgba(57,135,229,.5);background:rgba(57,135,229,.14)}
    .pill.gone{color:#f0a37f;border-color:rgba(217,89,38,.55);background:rgba(217,89,38,.14)}
    .pill.tight{color:#6fd3b0;border-color:rgba(25,158,112,.55);background:rgba(25,158,112,.14)}
    .pill.loose,.pill.reword,.pill.same{color:var(--mu);border-color:var(--edge2);background:rgba(255,255,255,.03)}
    .pill.same{color:var(--tx)}
    .pill.warn{color:#f0c36b;border-color:rgba(214,158,46,.55);background:rgba(214,158,46,.12)}
    .ver{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:22px;align-items:center}
    @media (max-width:800px){.ver{grid-template-columns:1fr}}
    .ver .big{font:700 34px/1.05 "Instrument Sans",sans-serif;letter-spacing:-.02em}
    .ver .sub{margin-top:10px;color:var(--mu);font-size:14.5px}
    .vl{display:flex;flex-direction:column;gap:9px}
    .vl div{display:grid;grid-template-columns:104px 1fr;gap:10px;align-items:start;font-size:13.5px}
    @media (max-width:440px){.vl div{grid-template-columns:1fr;gap:4px}}
    .gbar{display:flex;height:30px;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.06);border:1px solid var(--edge2)}
    .gbar i{display:flex;align-items:center;justify-content:center;min-width:30px;height:100%}
    .gbar i+i{border-left:2px solid var(--panel)}
    .gbar s{text-decoration:none;font:600 12px var(--mono);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    .chipb{padding:7px 11px;border-radius:8px;border:1px solid var(--edge2);background:rgba(255,255,255,.03);font:600 11px var(--mono);letter-spacing:.04em;color:var(--mu)}
    .chipb b{color:var(--tx);margin-left:5px}
    .chipb.on{border-color:var(--tx);color:var(--tx);background:rgba(255,255,255,.08)}
    .cards{display:flex;flex-direction:column;gap:12px;margin-top:14px}
    .card{border:1px solid var(--edge);border-radius:12px;background:rgba(255,255,255,.018);padding:14px 16px}
    .card .top{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
    .card .n{font:600 12px var(--mono);color:var(--dim);min-width:22px;padding-top:3px}
    .card h3{margin:0;font:700 16.5px/1.25 "Instrument Sans",sans-serif;flex:1 1 220px}
    .card .where{margin:6px 0 0 32px;font:500 10.5px/1.5 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--dim)}
    .wn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 0 32px}
    .wn div{padding:10px 12px;border-radius:9px;border:1px solid var(--grid);background:rgba(0,0,0,.18);font-size:13.5px;color:var(--mu)}
    .wn div.nw{color:var(--tx);border-color:var(--edge2)}
    .wn u{display:block;text-decoration:none;font:600 10px var(--mono);letter-spacing:.1em;color:var(--dim);margin-bottom:4px}
    .card .mean{margin:10px 0 0 32px;font-size:14px}
    .card .ask{margin:8px 0 0 32px;padding:8px 12px;border-left:3px solid var(--tx);background:rgba(255,255,255,.04);border-radius:0 8px 8px 0;font-size:13.5px}
    .card .ask u{text-decoration:none;font:600 10px var(--mono);letter-spacing:.1em;color:var(--mu);margin-right:8px}
    @media (max-width:640px){.wn{grid-template-columns:1fr}.wn,.card .mean,.card .ask,.card .where{margin-left:0}}
    .rows{display:flex;flex-direction:column}
    .row{padding:11px 0;border-top:1px solid var(--grid)}
    .row:first-child{border-top:0;padding-top:0}
    .row b{display:block;font-weight:600;font-size:14px}
    .row b em{font-style:normal;font:600 10.5px var(--mono);letter-spacing:.06em;color:var(--mu);margin-right:8px;text-transform:uppercase}
    .row span{display:block;color:var(--mu);font-size:13.5px;margin-top:2px}
    ul.em{margin:0;padding-left:18px;color:var(--mu)} ul.em li{margin:0 0 8px} ul.em li:first-child{color:var(--tx);font-weight:600}
    .tw{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:13.5px}
    th,td{padding:9px 8px;text-align:left;border-top:1px solid var(--grid);vertical-align:top}
    thead th{border-top:0;font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
    td.arr{color:var(--dim);font-family:var(--mono);width:20px}
    details{border-top:1px solid var(--grid)} details:first-of-type{border-top:0}
    summary{cursor:pointer;padding:12px 0;font-weight:600;font-size:14.5px;list-style:none;display:flex;justify-content:space-between;gap:10px}
    summary::-webkit-details-marker{display:none}
    summary::after{content:"+";font:600 16px var(--mono);color:var(--mu)} details[open] summary::after{content:"\2212"}
    summary small{font:500 11px var(--mono);color:var(--dim);margin-left:auto;white-space:nowrap}
    .doc p{margin:0 0 12px;color:#cfd5e8;font-size:14px;line-height:1.6;max-width:78ch;overflow-wrap:anywhere}
    .gate{text-align:center;padding:48px 20px;color:var(--mu)} .gate b{display:block;font-size:18px;color:var(--tx);margin-bottom:6px}
    .foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px;font:500 10.5px/1.6 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--dim)}
    @media (max-width:640px){.ttl b{font-size:22px}.ver .big{font-size:28px}.hdr{padding:16px}}
  </style>
</head>

<div class="wrap">
  <header class="panel hdr">
    <div class="ttl"><b>REP AGREEMENT REDLINE</b><span>Attorney's rewrite &middot; <span id="upd" style="display:inline;margin:0">loading</span></span></div>

    <button class="refresh" id="refresh" type="button" aria-label="Refresh"><svg viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/></svg>Refresh</button>

  <div id="app"><section class="panel gate"><b>Loading</b>Reading the redline.</section></div>

</div>

</html>
