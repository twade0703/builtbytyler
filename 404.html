<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found · BuiltByTyler</title>
  <meta name="description" content="That page doesn't exist. Head back to BuiltByTyler — websites and software for small businesses in Monterey County.">
  <meta name="robots" content="noindex, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* Standalone on purpose. A 404 that depends on the site's stylesheet fails
       exactly when something is already wrong, and Cloudflare Pages serves this
       for every unmatched path -- including ones where assets may not resolve. */
    :root{ --void:#05070B; --ink:#EDF1F7; --dim:#8894A6; --cyan:#4FD8E8; --line:rgba(160,175,200,.16); }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; background:var(--void); color:var(--ink);
      font:400 16px/1.6 "Instrument Sans",system-ui,-apple-system,sans-serif;
      display:grid; place-items:center; padding:32px 22px;
      -webkit-font-smoothing:antialiased;
    }
    .w{max-width:520px;text-align:center}
    .code{
      font:500 12px/1 "JetBrains Mono",ui-monospace,monospace;
      letter-spacing:.24em; text-transform:uppercase; color:var(--cyan);
      margin:0 0 20px;
    }
    h1{
      font:400 clamp(34px,7vw,52px)/1.08 "Instrument Serif",Georgia,serif;
      margin:0 0 16px; letter-spacing:-.01em;
    }
    h1 em{font-style:italic;color:var(--cyan)}
    p{color:var(--dim);margin:0 0 30px;font-size:16.5px}
    .row{display:flex;gap:11px;justify-content:center;flex-wrap:wrap}
    a.btn{
      display:inline-block; padding:12px 22px; border-radius:2px;
      font:500 12px/1 "JetBrains Mono",ui-monospace,monospace;
      letter-spacing:.13em; text-transform:uppercase; text-decoration:none;
      background:var(--cyan); color:#04222A; border:1px solid var(--cyan);
      transition:opacity .18s ease;
    }
    a.btn--ghost{background:transparent;color:var(--ink);border-color:var(--line)}
    a.btn:hover{opacity:.85}
    a.btn--ghost:hover{border-color:var(--cyan);color:var(--cyan)}
    a.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
    .sig{
      margin-top:34px;padding-top:20px;border-top:1px solid var(--line);
      font-size:13px;color:var(--dim);
    }
    .sig a{color:var(--dim);text-decoration:underline;text-underline-offset:2px}
    .sig a:hover{color:var(--cyan)}
    @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <div class="w">
    <p class="code">Error 404</p>
    <h1>That page doesn't <em>exist</em>.</h1>
    <p>It may have moved, or the link may be wrong. Everything else is still here.</p>
    <div class="row">
      <a class="btn" href="/">Home</a>
      <a class="btn btn--ghost" href="/software">Software &amp; web</a>
      <a class="btn btn--ghost" href="/contact">Contact</a>
    </div>
    <p class="sig">BuiltByTyler LLC &middot; Monterey, California &middot;
      <a href="mailto:twade@builtbytyler.com">twade@builtbytyler.com</a></p>
  </div>
</body>
</html>
