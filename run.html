<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Demo run &middot; Built by Tyler</title>
  <!-- Tyler's private live view of the demo factory run. Same private key as /hiring and /plan
       (after the # in his link); data from /api/hiring-board?doc=run, published every 5 minutes
       by leads/night/run_board.py on his PC. Counts and dollars only. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0B0C10">
  <meta name="apple-mobile-web-app-title" content="Demo run">
  <style>
    :root{--bg:#0B0C10;--card:#14161C;--card2:#1A1D25;--line:rgba(255,255,255,.08);--tx:#ECEEF3;--mu:#99A1B3;--dim:#646C7E;
      --blue:#60A5FA;--track:rgba(96,165,250,.14)}
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Instrument Sans",system-ui,-apple-system,sans-serif;
      padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
    button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
    .wrap{max-width:720px;margin:0 auto;padding:18px 16px 0}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
    .brand b{display:block;font:600 22px/1.1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em}
    .brand span{font:12px "JetBrains Mono",ui-monospace,monospace;color:var(--mu)}
    .refresh{display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:500}
    .refresh svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .refresh.spin svg{animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    h2{margin:22px 0 10px;font:600 18px/1.2 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.01em}
    h2 small{display:block;font:400 12.5px "Instrument Sans",sans-serif;color:var(--mu);margin-top:3px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
    .state{display:inline-block;padding:4px 10px;border-radius:999px;border:1px solid var(--line);font:500 12px "JetBrains Mono",ui-monospace,monospace;margin-bottom:8px}
    .state.on{border-color:rgba(96,165,250,.6);color:var(--blue)}
    .now b{display:block;font:600 24px/1.15 "Bricolage Grotesque",system-ui,sans-serif}
    .now p{margin:4px 0 0;color:var(--mu);font-size:14px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 13px}
    .stat b{display:block;font:500 28px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:-.04em}
    .stat u{display:block;text-decoration:none;font-size:12px;color:var(--mu);margin-top:7px}
    .meter{padding:12px 0;border-top:1px solid var(--line)}
    .meter:first-child{border-top:0;padding-top:0}
    .meter .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
    .meter .h b{font-size:15px;font-weight:600}
    .meter .h span{font:500 14px "JetBrains Mono",ui-monospace,monospace}
    .bar{position:relative;height:12px;border-radius:999px;background:var(--track);margin:8px 0 5px;overflow:hidden}
    .bar i{position:absolute;inset:0 auto 0 0;background:var(--blue);border-radius:999px}
    .bar em{position:absolute;top:0;bottom:0;width:2px;background:var(--tx)}
    .meter p{margin:0;font-size:12.5px;color:var(--mu)}
    table{width:100%;border-collapse:collapse;font-size:13.5px}
    th,td{padding:8px 6px;text-align:right;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
    th:first-child,td:first-child{text-align:left}
    thead th{border-top:0;font:600 12px "JetBrains Mono",ui-monospace,monospace;color:var(--mu)}
    td.st{font:500 12px "JetBrains Mono",ui-monospace,monospace;color:var(--mu)}
    tr.run td{color:var(--blue)}
    .log{font:11.5px/1.5 "JetBrains Mono",ui-monospace,monospace;color:var(--mu);white-space:pre-wrap;word-break:break-word}
    .note{margin:8px 0 0;font-size:12.5px;color:var(--mu)}
    .gate{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 18px;color:var(--mu);text-align:center;margin-top:12px}
    .gate b{display:block;color:var(--tx);font-size:17px;margin-bottom:6px}
    .foot{margin:22px 0 0;font-size:12px;color:var(--dim);text-align:center}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand"><b>Demo run</b><span id="upd">Loading…</span></div>
      <button class="refresh" id="refresh" type="button" aria-label="Refresh"><svg viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3"/></svg>Refresh</button>
    </header>
    <main id="app"></main>
    <p class="foot">Private to Tyler. Your PC sends new numbers every 5 minutes; this page checks every minute.</p>
  </div>
  <script src="assets/js/run-board.js?v=1"></script>
</body>
</html>
