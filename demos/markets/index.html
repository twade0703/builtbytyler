<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Markets Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* v5, 2026-10-28. Tyler: "could look a little bit less like AI". The v4 desk was
   six panels of read-outs, neon on black, a scripted caption bar and a tab rail.
   This is the opposite brief: one chart that is always populated, a watchlist,
   key stats and alerts, and nothing else. One accent (the site cyan). Up and down
   are always carried by a sign and an arrow (and hollow/filled candles), never by
   colour alone.
   The frame is a fixed 1312x832 picture scaled to whatever hosts it (software.html
   iframes it at that ratio). A standalone portrait phone gets a stacked layout. */
:root{
  --bg:#04070C; --win:#060A10; --raise:#0A1018;
  --ink:#E8EEF6; --mu:#8D99AB; --dim:#5D687A;
  --hair:rgba(150,200,230,.11); --hair2:rgba(150,200,230,.065);
  --ac:#5FE6FF; --ac-rgb:95,230,255;
  --up:#56C292; --dn:#E8846E;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:400 14px/1.3 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;font-variant-numeric:tabular-nums}
html,body{overscroll-behavior-x:none}
html.embed,html.embed body{background:transparent}
html.embed{color-scheme:normal}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.up{color:var(--up)} .dn{color:var(--dn)} .fl{color:var(--mu)}

/* ---------- the fixed frame */
.fit{position:fixed;inset:0;overflow:hidden}
.stage{position:absolute;left:50%;top:50%;width:1312px;height:832px;transform-origin:center}
.win{width:100%;height:100%;background:var(--win);border:1px solid var(--hair);border-radius:8px;overflow:hidden;
  display:grid;grid-template-rows:56px minmax(0,1fr) 34px}
html.embed .win{border:0;border-radius:0}

/* ---------- top bar */
.top{display:flex;align-items:center;gap:22px;padding:0 20px 0 22px;border-bottom:1px solid var(--hair);min-width:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:-.01em;flex:none}
.brand svg{width:20px;height:20px;display:block}
.search{position:relative;flex:none;width:188px}
.search label{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px 0 10px;border:1px solid var(--hair);border-radius:6px;background:var(--raise);color:var(--dim);cursor:text}
.search label:focus-within{border-color:rgba(var(--ac-rgb),.55)}
.search svg{width:14px;height:14px;flex:none}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:13px;color:var(--ink);padding:0}
.search input::placeholder{color:var(--dim)}
.search kbd{font:500 11px/1 var(--sans);color:var(--dim);border:1px solid var(--hair);border-radius:4px;padding:3px 6px}
.search ul{position:absolute;left:0;right:0;top:38px;margin:0;padding:4px;list-style:none;background:var(--raise);border:1px solid var(--hair);border-radius:8px;z-index:9;display:none;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.search ul.show{display:block}
.search li{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:5px;font-size:13px;cursor:pointer}
.search li span{color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search li.on,.search li:hover{background:rgba(var(--ac-rgb),.08)}
.tape{flex:1;display:flex;gap:2px;min-width:0;overflow:hidden}
.ix{display:grid;grid-template-columns:auto auto;column-gap:8px;row-gap:3px;align-items:baseline;padding:6px 10px;border-radius:6px;white-space:nowrap;font-size:13px}
.ix span{grid-column:1/3;font-size:11.5px}
.ix:hover{background:rgba(255,255,255,.035)}
.ix.on{background:rgba(var(--ac-rgb),.07)}
.ix span{color:var(--mu)}
.ix b{font-weight:500}
.ix em{font-style:normal;font-size:12.5px}
.sess{flex:none;display:grid;grid-template-columns:auto auto;column-gap:7px;row-gap:3px;align-items:center;justify-items:end;font-size:11.5px;color:var(--mu);white-space:nowrap}
.sess i{width:6px;height:6px;border-radius:50%;background:var(--ac)}
.sess.closed i{background:var(--dim)}
.sess b{grid-column:1/3;font-weight:500;font-size:13px;color:var(--ink)}

/* ---------- body */
.body{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0}
.main{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0;padding:26px 30px 0 32px}
.qhd{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
.who{display:flex;align-items:baseline;gap:10px;font-size:15px}
.who b{font-weight:600;letter-spacing:.01em}
.who span{color:var(--mu)}
.who small{font-size:11.5px;color:var(--dim);border:1px solid var(--hair);border-radius:4px;padding:2px 6px;align-self:center}
.px{display:flex;align-items:baseline;gap:16px;margin-top:10px}
.px b{font:500 46px/1 var(--sans);letter-spacing:-.025em}
.chg{font-size:15px;font-weight:500}
.chg span{color:var(--mu);font-weight:400;margin-left:6px}
.rchg{font-size:15px;font-weight:500}
.rchg:not(:empty){padding-left:16px;border-left:1px solid var(--hair)}
.rchg span{color:var(--mu);font-weight:400;margin-left:6px}
.ctl{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.seg{display:inline-flex;padding:3px;border:1px solid var(--hair);border-radius:7px;background:var(--raise)}
.seg button{font-size:12.5px;font-weight:500;color:var(--mu);padding:5px 11px;border-radius:5px;transition:color .2s,background .2s}
.seg button:hover{color:var(--ink)}
.seg button.on{color:var(--ink);background:rgba(255,255,255,.075)}
.seg button[disabled]{color:var(--dim);opacity:.5;cursor:default}

.chart{position:relative;min-height:0;margin:16px -2px 0 0}
.chart canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.ckey{position:absolute;left:0;top:2px;font-size:11.5px;color:var(--dim);pointer-events:none;opacity:0;transition:opacity .3s}
.ckey.show{opacity:1}
.tip{position:absolute;top:8px;pointer-events:none;background:#0A1018;border:1px solid var(--hair);border-radius:6px;padding:8px 10px;font-size:12px;line-height:1.55;white-space:nowrap;opacity:0;transition:opacity .12s;z-index:3}
.tip.show{opacity:1}
.tip div{display:flex;justify-content:space-between;gap:14px}
.tip span{color:var(--mu)}
.tip .t{color:var(--ink);font-weight:500;margin-bottom:2px}

.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));margin:0 0 0 -32px;padding:0 0 0 32px;border-top:1px solid var(--hair);margin-right:-30px}
.st{padding:15px 18px 18px 0}
.st+.st{padding-left:18px;border-left:1px solid var(--hair2)}
.st dt{font-size:12px;color:var(--mu)}
.st dd{margin:7px 0 0;font-size:15px;font-weight:500;white-space:nowrap}
.rng{position:relative;height:3px;margin-top:9px;border-radius:2px;background:rgba(255,255,255,.09)}
.rng i{position:absolute;top:-3px;width:2px;height:9px;margin-left:-1px;background:var(--ink);border-radius:1px}

/* ---------- side: watchlist and alerts */
.side{border-left:1px solid var(--hair);display:flex;flex-direction:column;min-height:0}
.side h2{display:flex;justify-content:space-between;align-items:baseline;margin:0;padding:20px 20px 10px;font-size:13px;font-weight:600}
.side h2 span{font-weight:400;color:var(--dim);font-size:12px}
.rows{display:flex;flex-direction:column;padding:0 10px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 72px 92px;align-items:center;gap:12px;height:51px;padding:0 10px;border-radius:7px;position:relative}
.row:hover{background:rgba(255,255,255,.03)}
.row.on{background:rgba(var(--ac-rgb),.065)}
.row.on::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:2px;border-radius:2px;background:var(--ac)}
.row .n{min-width:0}
.row .n b{display:block;font-size:13.5px;font-weight:600}
.row .n span{display:block;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row svg{width:72px;height:26px;display:block;overflow:visible}
.row .p{text-align:right}
.row .p b{display:block;font-size:13.5px;font-weight:500}
.row .p em{display:block;font-style:normal;font-size:12px;margin-top:2px}
.alerts{border-top:1px solid var(--hair);margin-top:auto}
.alerts h2{padding-top:18px}
.al{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;margin:0 10px;padding:9px 10px;border-radius:7px;height:50px}
.al .c b{font-size:13px;font-weight:600;margin-right:6px}
.al .c span{font-size:12.5px;color:var(--mu)}
.al .s{text-align:right;font-size:12px;color:var(--mu);white-space:nowrap}
.al .s b{display:block;font-weight:500;font-size:12.5px;color:var(--ink)}
.al .s svg{width:11px;height:11px;vertical-align:-1px;margin-right:4px}
.al.hit .s b{color:var(--ac)}
.al.flash{animation:flash 2.4s ease-out}
@keyframes flash{0%{background:rgba(var(--ac-rgb),.14)}100%{background:transparent}}
.alerts .pad{height:12px}

/* ---------- foot */
.foot{display:flex;align-items:center;gap:16px;padding:0 14px 0 22px;border-top:1px solid var(--hair);font-size:12px;color:var(--dim);white-space:nowrap;min-width:0}
.foot .src{flex:1;overflow:hidden;text-overflow:ellipsis}
.tour{display:flex;align-items:center;gap:7px;color:var(--mu);padding:4px 8px;border-radius:5px}
.tour:hover{color:var(--ink);background:rgba(255,255,255,.04)}
.tour svg{width:10px;height:10px}

/* ---------- standalone portrait phone: the same parts, stacked */
html.flow,html.flow body{overflow-x:hidden;overflow-y:auto;height:auto}
html.flow .fit{position:static;overflow:visible}
html.flow .stage{position:static;width:auto;height:auto;transform:none!important}
html.flow .win{border:0;border-radius:0;display:block}
html.flow .top{flex-wrap:wrap;gap:12px;padding:14px 16px}
html.flow .brand{flex:1}
html.flow .search{order:3;width:100%}
html.flow .tape{order:4;flex:0 0 100%;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 12px;gap:0}
html.flow .tape::-webkit-scrollbar{display:none}
html.flow .body{display:block}
html.flow .main{display:block;padding:20px 16px 0}
html.flow .qhd{flex-direction:column;align-items:stretch;gap:16px}
html.flow .px b{font-size:38px}
html.flow .px{flex-wrap:wrap;row-gap:6px}
html.flow .ctl{flex-direction:row;justify-content:space-between;align-items:center}
html.flow .chart{height:280px;margin-right:0}
html.flow .stats{grid-template-columns:1fr 1fr;margin:8px -16px 0;padding:0 16px}
html.flow .st{padding:14px 0 14px 0!important;border-left:0!important;border-bottom:1px solid var(--hair2)}
html.flow .st:nth-child(even){padding-left:16px!important;border-left:1px solid var(--hair2)!important}
html.flow .st:nth-child(odd){padding-right:16px!important}
html.flow .side{border-left:0;border-top:1px solid var(--hair);margin-top:4px}
html.flow .rows,html.flow .al{margin-left:0;margin-right:0}
html.flow .rows{padding:0 6px}
html.flow .al{margin:0 6px}
html.flow .foot{padding:14px 16px;height:auto;white-space:normal;align-items:flex-start;flex-direction:column;gap:8px}
@media (prefers-reduced-motion:reduce){.al.flash{animation:none}}
</style>
</head>
<body>
<div class="fit"><div class="stage" id="stage">
  <div class="win">
    <header class="top">
      <div class="brand"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x=".5" y=".5" width="19" height="19" rx="5" fill="none" stroke="rgba(150,200,230,.35)"/><path d="M4.5 13.5l3.5-4 3 2.5 4-5.5" fill="none" stroke="#5FE6FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Markets</div>
      <div class="search">
        <label><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 10.5l3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <input id="q" type="text" placeholder="Search symbols" autocomplete="off" spellcheck="false" aria-label="Search symbols"><kbd>/</kbd></label>
        <ul id="qList" role="listbox"></ul>
      </div>
      <nav class="tape" id="tape" aria-label="Indices"></nav>
      <div class="sess" id="sess"><i></i><span id="sessL">Replay</span><b id="sessT">1:30 PM ET</b></div>
    </header>

    <div class="body">
      <section class="main">
        <div class="qhd">
          <div>
            <div class="who"><b id="sym">NVDA</b><span id="nm">NVIDIA</span><small id="kind">Stock</small></div>
            <div class="px"><b id="px">0.00</b><div class="chg" id="chg"></div><div class="rchg" id="rchg"></div></div>
          </div>
          <div class="ctl">
            <div class="seg" id="ranges" role="tablist" aria-label="Range"></div>
            <div class="seg" id="types" role="tablist" aria-label="Chart type"></div>
          </div>
        </div>
        <div class="chart" id="chart">
          <canvas id="cv"></canvas>
          <div class="ckey" id="ckey">Hollow candle: closed up · Filled: closed down</div>
          <div class="tip" id="tip"></div>
        </div>
        <dl class="stats" id="stats"></dl>
      </section>

      <aside class="side">
        <section><h2>Watchlist<span id="wlN"></span></h2><div class="rows" id="rows"></div></section>
        <section class="alerts"><h2>Alerts<span id="alN"></span></h2><div id="alerts"></div><div class="pad"></div></section>
      </aside>
    </div>

    <footer class="foot">
      <span class="src" id="src">Public market data · session replay</span>
      <button class="tour" id="tour" type="button"></button>
    </footer>
  </div>
</div></div>

<script src="data.js?v=996b2c0a"></script>
<script src="app.js?v=217041b5"></script>
</body>
</html>
