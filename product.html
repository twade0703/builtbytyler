<!-- Structured data. Every fact here is one this site already states in prose:
       the entity, the city and the email come off contact.html. Nothing is
       invented — a schema block with a made-up address is worse than none,
       because Google cross-checks it against the Business Profile. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfessionalService",
    "@id": "https://builtbytyler.com/#business",
    "name": "BuiltByTyler LLC",
    "alternateName": "BuiltByTyler",
    "url": "https://builtbytyler.com/",
    "email": "twade@builtbytyler.com",
    "telephone": "+12817398942",
    "description": "A one-person studio in Monterey, California building websites and software for small businesses and trades, plus mechanical products — robotics, drones and custom builds.",
    "founder": { "@type": "Person", "name": "Tyler Wade" },
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "770 Madison St",
      "addressLocality": "Monterey",
      "addressRegion": "CA",
      "postalCode": "93940",
      "addressCountry": "US"
    },
    "areaServed": [
      { "@type": "AdministrativeArea", "name": "Monterey County, California" },
      { "@type": "AdministrativeArea", "name": "Santa Cruz County, California" },
      { "@type": "AdministrativeArea", "name": "San Benito County, California" },
      { "@type": "AdministrativeArea", "name": "San Francisco Bay Area, California" }
    ],
    "knowsAbout": [
      "website design for contractors",
      "local SEO for trades businesses",
      "small business websites",
      "custom software"
    ],
    "sameAs": [
      "https://www.linkedin.com/in/tyler-wade1/",
      "https://instagram.com/twade0703"
    ]
  }
  </script>
</head>

  <!-- ?v=3 busts the module cache. three.js is vendored at assets/vendor/,
       so the star field no longer needs an inline importmap (which the CSP
       blocks) or a third-party fetch from unpkg. A returning visitor still
       holding an older starfield.js would pair it with HTML that no longer
       ships that map, so the version query has to move whenever this does. -->
  <script type="module" src="assets/js/starfield.js?v=3"></script>
</body>
